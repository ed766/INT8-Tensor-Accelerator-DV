<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390">
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#263238"/></marker></defs>
  <rect width="1080" height="390" fill="#f7f3e8"/>
  <text x="540" y="34" text-anchor="middle" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#263238">GCC RV32I and INT8 accelerator co-verification</text>
  <g font-family="DejaVu Sans" text-anchor="middle">
    <rect x="35" y="105" width="180" height="105" rx="12" fill="#d8edf0" stroke="#007c91" stroke-width="2"/><text x="125" y="140" font-size="17" font-weight="bold">PyTorch oracle</text><text x="125" y="166" font-size="13">shared tensors</text><text x="125" y="187" font-size="13">expected INT8 output</text>
    <rect x="280" y="75" width="190" height="105" rx="12" fill="#f2dfd7" stroke="#d6532f" stroke-width="2"/><text x="375" y="110" font-size="17" font-weight="bold">GCC bare-metal C</text><text x="375" y="136" font-size="13">scalar RV32I kernel</text><text x="375" y="157" font-size="13">-O2, no RV32M</text>
    <rect x="280" y="235" width="190" height="105" rx="12" fill="#eee6d0" stroke="#c28b16" stroke-width="2"/><text x="375" y="270" font-size="17" font-weight="bold">RV32I firmware</text><text x="375" y="296" font-size="13">MMIO configuration</text><text x="375" y="317" font-size="13">stream and polling</text>
    <rect x="535" y="235" width="190" height="105" rx="12" fill="#e1eadb" stroke="#486b35" stroke-width="2"/><text x="630" y="268" font-size="17" font-weight="bold">APB integration</text><text x="630" y="294" font-size="13">AXI-Lite bridge</text><text x="630" y="315" font-size="13">AXI-Stream mailboxes</text>
    <rect x="790" y="235" width="245" height="105" rx="12" fill="#e7dfed" stroke="#725a9b" stroke-width="2"/><text x="912" y="268" font-size="17" font-weight="bold">INT8 accelerator RTL</text><text x="912" y="294" font-size="13">4 lanes x 4 outputs</text><text x="912" y="315" font-size="13">measured compute counters</text>
    <rect x="790" y="75" width="245" height="105" rx="12" fill="#e8e8e8" stroke="#455a64" stroke-width="2"/><text x="912" y="108" font-size="17" font-weight="bold">Independent checking</text><text x="912" y="134" font-size="13">scalar = accelerator = PyTorch</text><text x="912" y="155" font-size="13">cycles, tags, counts, assertions</text>
