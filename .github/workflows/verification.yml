name: verification

on:
  push:
  pull_request:

jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install open-source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys boolector make g++
          python -m pip install click numpy
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          git clone https://github.com/YosysHQ/sby.git /tmp/sby
          git -C /tmp/sby checkout b1a1e98cba941ec8433f8dc27f416cd7bb7f14be
          sudo make -C /tmp/sby install PREFIX=/usr/local
          boolector --version
      - name: Run complete evidence gate
        run: make release-check
      - name: Require reproducible reports
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: int8-accelerator-evidence
          path: |
            reports/
            build/formal.log
